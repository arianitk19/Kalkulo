<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#05080d">
<meta name="description" content="KALKULO X — kalkulator financiar për Kosovën: paga neto, Trusti, dogana e veturave, energjia, tatimi në pronë, valutat dhe kriptovalutat.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KALKULO X">
<meta property="og:title" content="KALKULO X — Platforma financiare">
<meta property="og:description" content="Paga, dogana, tatimet, energjia dhe tregjet live — në një vend.">
<meta property="og:type" content="website">
<title>KALKULO X — Platforma financiare</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<div id="bgfx" aria-hidden="true"><div class="glow g1"></div><div class="glow g2"></div></div>

<div id="intro" aria-hidden="true">
  <div class="logo w-20 h-20 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-700 flex items-center justify-center shadow-[0_18px_50px_rgba(16,185,129,.45)]">
    <svg class="w-11 h-11 text-black" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 18h8"/></svg>
  </div>
  <h1 class="dsp text-4xl font-extrabold mt-7">KALKULO <span class="text-emerald-500">X</span></h1>
</div>

<div id="app">
    <!-- Pjesa e sipërme fikse: header + navigim (desktop) + ticker -->
    <header id="top" class="topbar">
      <div class="topbar-row">
        <a href="#/" class="flex items-center gap-3 shrink-0" aria-label="KALKULO X — Ballina">
          <div class="brand-mark">
            <svg class="w-5 h-5 text-black" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2"/></svg>
          </div>
          <div class="leading-none">
            <p class="dsp text-[15px] font-bold">KALKULO <span class="text-emerald-500">X</span></p>
            <span id="crumb" class="crumb">Platforma financiare</span>
          </div>
        </a>
        <nav id="topnav" class="topnav" aria-label="Navigimi kryesor"></nav>
        <div class="flex items-center gap-2 shrink-0">
          <span id="topLive" class="hidden sm:inline-flex"></span>
          <a href="#/assistant" id="aiTopBtn" class="ai-top press" aria-label="Asistenti"></a>
          <a href="#/settings" id="gearBtn" class="icon-btn sm press" aria-label="Cilësimet"></a>
        </div>
      </div>
      <div id="tbar" class="tbar" aria-label="Tregjet live">
        <div class="tbar-label">
          <span class="relative flex h-1.5 w-1.5"><span id="tickDot" class="relative rounded-full h-1.5 w-1.5 bg-emerald-500"></span><span class="animate-ping absolute h-full w-full rounded-full bg-emerald-500 opacity-75"></span></span>
          <span class="text-[8px] font-bold uppercase tracking-[0.18em]">Live</span>
        </div>
        <div class="tick" id="tick"></div>
      </div>
    </header>

    <main id="main">
      <div id="view" class="nosb"></div>
    </main>
</div>

<!-- Menuja e poshtme (telefon) -->
<nav id="dock" class="dock" aria-label="Navigimi kryesor">
  <div class="dock-bar">
    <span class="dock-ind" aria-hidden="true"></span>
    <div id="dockItems" class="dock-items"></div>
  </div>
</nav>


  <!-- Asistenti -->
  <div id="scrim" aria-hidden="true"></div>

  <section id="ai" class="overlay" aria-hidden="true" aria-label="Asistenti">
    <div class="px-5 pb-4 safe-t flex items-center justify-between border-b border-white/5">
      <div class="flex items-center gap-3">
        <div id="aiIco" class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-700 flex items-center justify-center"></div>
        <div><h2 class="dsp font-bold text-base leading-none">Asistenti KALKULO</h2><p class="text-[9px] font-medium uppercase tracking-[0.16em] mt-1" style="color:var(--muted)"><span id="aiSt">Inteligjencë financiare</span></p></div>
      </div>
      <button type="button" id="aiClose" class="icon-btn sm press" aria-label="Mbyll"></button>
    </div>
    <div id="aiChat" class="flex-1 overflow-y-auto nosb px-5 py-5 space-y-3" aria-live="polite"></div>
    <div class="px-4 pt-2 border-t border-white/5" style="padding-bottom:calc(var(--safeb) + 16px)">
      <div id="aiChips" class="flex gap-2 overflow-x-auto nosb pb-3"></div>
      <form id="aiForm" class="flex items-center gap-2">
        <button type="button" id="aiMic" class="w-12 h-12 shrink-0 rounded-xl panel flex items-center justify-center press" aria-label="Fol"></button>
        <input id="aiIn" class="flex-1 min-w-0 h-12 px-4 rounded-xl panel text-sm" placeholder="Shkruaj pyetjen… p.sh. “paga 900”" autocomplete="off" enterkeyhint="send">
        <button type="submit" id="aiSend" class="w-12 h-12 shrink-0 rounded-xl bg-emerald-500 flex items-center justify-center press text-black" aria-label="Dërgo"></button>
      </form>
    </div>
  </section>

  <!-- Paneli anësor (Cilësimet / Historiku / Ndihma) -->
  <aside id="sheet" class="overlay nosb" aria-hidden="true"></aside>

  <div id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:2rem;text-align:center">KALKULO X kërkon JavaScript.</p></noscript>
</body>
</html>
