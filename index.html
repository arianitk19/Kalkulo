    <style>
        :root { 
            --accent: #10b981; 
            --bg: #010204; 
            --glass: rgba(10, 15, 25, 0.7);
        }
        
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background: var(--bg); 
            color: #fff; 
            overflow: hidden; 
            touch-action: manipulation; 
        }

        .glass-view {
            background: var(--glass);
            backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Navigimi Mobile & Desktop */
        .mobile-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .active-nav { color: var(--accent); transform: translateY(-5px); }
        .active-nav svg { filter: drop-shadow(0 0 12px var(--accent)); }

        /* Sfondi Dinamik për Këmbimin */
        .money-bg {
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.pattern');
            background-color: rgba(16, 185, 129, 0.05);
        }

        /* Inputet Profesionale */
        input {
            background: transparent;
            border-bottom: 2px solid rgba(255,255,255,0.05);
            transition: all 0.4s ease;
        }
        input:focus {
            border-bottom-color: var(--accent);
            transform: scale(1.01);
            outline: none;
        }

        /* Scrollbar i padukshëm */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Animacionet e Sektorëve */
        .sector-animate { animation: fadeInUp 0.6s ease forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<script>
   
// --- 1. KONFIGURIMI I GJUHËS (PLISET) ---
const langData = {
    sq: {
        title: "CILËSIMET", sub: "KONFIGURIMI I SISTEMIT", notif: "Njoftimet", mode: "Tema e Errët", lang: "Gjuha / Language", haptic: "Vibrimi (Haptic)", btn_active: "AKTIV",
        nav_trusti: "Trusti", nav_valuta: "Këmbimi", nav_paga: "Paga", nav_kesco: "Energjia", nav_dogana: "Dogana", nav_crypto: "Crypto",
        t_title: "TRUSTI <span class='text-emerald-500'>PENSIONAL</span>", t_desc: "Llogaritja e kursimeve 5% punëtori + 5% punëdhënësi.", t_label: "Paga Bruto Mujore (€)", t_w: "Punëtori (5%)", t_e: "Punëdhënësi (5%)", t_total: "Totali Mujor",
        v_title: "KËMBIMI <span class='text-emerald-500'>GLOBAL</span>", v_ph: "Shuma në Euro",
        p_title: "PAGA <span class='text-emerald-500'>NETO</span>", p_ph: "Paga Bruto", p_n: "Paga Neto", p_t: "Tatimi ATK", p_tr: "Trusti (5%)",
        k_title: "ENERGJIA <span class='text-yellow-500'>KESCO</span>", k_d: "Tarifa e Ditës (kWh)", k_n: "Tarifa e Natës (kWh)", k_res: "Vlera e Faturës (Me TVSH)", k_dis: "Ky kalkulim bazohet në tarifat 2026.",
        d_title: "DOGANA <span class='text-blue-500'>VETURA</span>", d_y: "Viti i Prodhimit", d_c: "Kubikazha (cm³)", d_v: "Vlera (€)", d_res: "Totali i Pagesës Doganore",
        c_title: "CRYPTO <span class='text-purple-500'>ASSETS</span>", c_inv: "Investimi në Euro (€)"
    },
    en: {
        title: "SETTINGS", sub: "SYSTEM CONFIGURATION", notif: "Notifications", mode: "Dark Mode", lang: "Language / Gjuha", haptic: "Haptic Feedback", btn_active: "ACTIVE",
        nav_trusti: "Trust", nav_valuta: "Exchange", nav_paga: "Salary", nav_kesco: "Energy", nav_dogana: "Customs", nav_crypto: "Crypto",
        t_title: "PENSION <span class='text-emerald-500'>TRUST</span>", t_desc: "Calculation of 5% employee + 5% employer savings.", t_label: "Monthly Gross Salary (€)", t_w: "Employee (5%)", t_e: "Employer (5%)", t_total: "Monthly Total",
        v_title: "GLOBAL <span class='text-emerald-500'>EXCHANGE</span>", v_ph: "Amount in Euro",
        p_title: "NET <span class='text-emerald-500'>SALARY</span>", p_ph: "Gross Salary", p_n: "Net Salary", p_t: "ATK Tax", p_tr: "Trust (5%)",
        k_title: "ENERGY <span class='text-yellow-500'>KESCO</span>", k_d: "Day Rate (kWh)", k_n: "Night Rate (kWh)", k_res: "Invoice Value (Inc. VAT)", k_dis: "Based on 2026 standard rates.",
        d_title: "CAR <span class='text-blue-500'>CUSTOMS</span>", d_y: "Production Year", d_c: "Engine Size (cm³)", d_v: "Value (€)", d_res: "Total Customs Payment",
        c_title: "CRYPTO <span class='text-purple-500'>ASSETS</span>", c_inv: "Investment in Euro (€)"
    }
};

let currentLang = localStorage.getItem('k-lang') || 'sq';

// --- 2. FUNKSIONET E SISTEMIT (THEME, HAPTIC, LANG) ---
function triggerHaptic() {
    if (navigator.vibrate) navigator.vibrate(10);
}

function setLanguage(l) {
    currentLang = l;
    localStorage.setItem('k-lang', l);
    triggerHaptic();
    
    // Përditëso UI fiks (Settings)
    document.getElementById('sett-title').innerText = langData[l].title;
    document.getElementById('sett-subtitle').innerText = langData[l].sub;
    document.getElementById('label-notifications').innerText = langData[l].notif;
    document.getElementById('label-mode').innerText = langData[l].mode;
    document.getElementById('label-lang').innerText = langData[l].lang;

    // Butonat e gjuhës
    const isSq = l === 'sq';
    document.getElementById('lang-sq').className = isSq ? 'flex-1 py-2 rounded-lg text-xs font-bold bg-emerald-500 text-black' : 'flex-1 py-2 rounded-lg text-xs font-bold text-gray-400';
    document.getElementById('lang-en').className = !isSq ? 'flex-1 py-2 rounded-lg text-xs font-bold bg-emerald-500 text-black' : 'flex-1 py-2 rounded-lg text-xs font-bold text-gray-400';

    // Përditëso Navigimin
    const navItems = document.querySelectorAll('.mobile-nav-item span');
    const keys = ['nav_trusti', 'nav_valuta', 'nav_paga', 'nav_kesco', 'nav_dogana', 'nav_crypto'];
    navItems.forEach((span, i) => { span.innerText = langData[l][keys[i]]; });

    // Refresh pamjen aktuale që të përkthehet edhe përmbajtja dinamike
    const activeNav = document.querySelector('.active-nav');
    if(activeNav) {
        const view = activeNav.getAttribute('onclick').match(/'([^']+)'/)[1];
        injectData(view, document.getElementById('content-inner'));
    }
}

// --- 3. INJEKTIMI DINAMIK I TË DHËNAVE (I PLOTË) ---
function injectData(view, container) {
    let html = "";
    const d = langData[currentLang]; // Shkurtesë për qasje më të shpejtë

    switch(view) {
        case 'trusti':
            html = `
            <div class="space-y-12 sector-animate">
                <div class="border-l-4 border-emerald-500 pl-6">
                    <h2 class="text-5xl font-black tracking-tighter uppercase">${d.t_title}</h2>
                    <p class="text-gray-500 mt-2 font-light">${d.t_desc}</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                    <div class="space-y-8">
                        <label class="text-[10px] uppercase tracking-widest text-emerald-500 font-bold mb-4 block">${d.t_label}</label>
                        <input type="number" id="t-bruto" oninput="calcT()" class="w-full text-7xl font-bold bg-transparent outline-none" placeholder="0">
                    </div>
                    <div class="space-y-4">
                        <div class="glass-view p-8 rounded-[2rem] flex justify-between items-center border-l-8 border-emerald-500">
                            <span class="text-gray-400 font-bold uppercase text-[10px] tracking-widest">${d.t_w}</span>
                            <span id="t-p" class="text-3xl font-black tracking-tighter">0.00 €</span>
                        </div>
                        <div class="glass-view p-8 rounded-[2rem] flex justify-between items-center border-l-8 border-white/20">
                            <span class="text-gray-400 font-bold uppercase text-[10px] tracking-widest">${d.t_e}</span>
                            <span id="t-d" class="text-3xl font-black tracking-tighter">0.00 €</span>
                        </div>
                        <div class="bg-emerald-500 p-8 rounded-[2rem] flex justify-between items-center text-black">
                            <span class="font-black uppercase text-xs tracking-widest">${d.t_total}</span>
                            <span id="t-t" class="text-4xl font-black tracking-tighter">0.00 €</span>
                        </div>
                    </div>
                </div>
            </div>`;
            break;

        case 'valuta':
            html = `
            <div class="space-y-10 sector-animate">
                <h2 class="text-5xl font-black tracking-tighter uppercase">${d.v_title}</h2>
                <input type="number" id="v-in" oninput="calcV()" placeholder="${d.v_ph}" class="w-full text-7xl font-bold bg-transparent border-b-2 border-emerald-500/30 pb-6 outline-none">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    ${['USD', 'GBP', 'CHF', 'ALL', 'TRY', 'AUD', 'CAD', 'JPY'].map(m => `
                        <div class="glass-view p-6 rounded-3xl flex flex-col items-center">
                            <span class="text-gray-500 font-black text-xs mb-2">${m}</span>
                            <span id="v-${m}" class="text-2xl font-bold text-emerald-500">0.00</span>
                        </div>
                    `).join('')}
                </div>
            </div>`;
            break;

        case 'paga':
            html = `
            <div class="space-y-12 sector-animate">
                <h2 class="text-5xl font-black tracking-tighter uppercase">${d.p_title}</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                    <input type="number" id="p-in" oninput="calcP()" placeholder="${d.p_ph}" class="text-6xl font-bold w-full bg-transparent outline-none">
                    <div class="space-y-6">
                        <div class="p-8 glass-view rounded-[2.5rem] bg-emerald-500/5">
                            <p class="text-xs font-bold text-emerald-500 mb-2 uppercase tracking-widest">${d.p_n}</p>
                            <h3 id="p-neto" class="text-5xl font-black tracking-tighter">0.00 €</h3>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="p-6 glass-view rounded-3xl">
                                <p class="text-[10px] text-gray-500 uppercase font-bold">${d.p_t}</p>
                                <p id="p-atk" class="text-xl font-bold text-red-500">0.00 €</p>
                            </div>
                            <div class="p-6 glass-view rounded-3xl">
                                <p class="text-[10px] text-gray-500 uppercase font-bold">${d.p_tr}</p>
                                <p id="p-trust" class="text-xl font-bold">0.00 €</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
            break;

        case 'kesco':
            html = `
            <div class="space-y-10 sector-animate">
                <h2 class="text-5xl font-black tracking-tighter uppercase">${d.k_title}</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-6">
                        <div>
                            <label class="text-xs uppercase font-bold text-gray-500 tracking-widest mb-2 block">${d.k_d}</label>
                            <input type="number" id="k-d" oninput="calcK()" class="w-full text-4xl font-bold bg-transparent outline-none border-b border-white/10">
                        </div>
                        <div>
                            <label class="text-xs uppercase font-bold text-gray-500 tracking-widest mb-2 block">${d.k_n}</label>
                            <input type="number" id="k-n" oninput="calcK()" class="w-full text-4xl font-bold bg-transparent outline-none border-b border-white/10">
                        </div>
                    </div>
                    <div class="p-10 glass-view rounded-[3rem] text-center border-t-8 border-yellow-500">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">${d.k_res}</p>
                        <h3 id="k-res" class="text-6xl font-black text-yellow-500">0.00 €</h3>
                        <p class="text-[10px] text-gray-600 mt-6 uppercase tracking-widest italic">${d.k_dis}</p>
                    </div>
                </div>
            </div>`;
            break;

        case 'dogana':
            html = `
            <div class="space-y-10 sector-animate">
                <h2 class="text-5xl font-black tracking-tighter uppercase">${d.d_title}</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="glass-view p-6 rounded-3xl">
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-2">${d.d_y}</label>
                        <select id="d-viti" onchange="calcD()" class="bg-transparent text-xl font-bold w-full outline-none">
                            <option value="2024" class="bg-slate-900">2024</option><option value="2020" class="bg-slate-900">2020</option>
                        </select>
                    </div>
                    <div class="glass-view p-6 rounded-3xl">
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-2">${d.d_c}</label>
                        <input type="number" id="d-kub" oninput="calcD()" placeholder="2000" class="text-xl font-bold w-full bg-transparent outline-none">
                    </div>
                    <div class="glass-view p-6 rounded-3xl">
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-2">${d.d_v}</label>
                        <input type="number" id="d-vle" oninput="calcD()" placeholder="15000" class="text-xl font-bold w-full bg-transparent outline-none">
                    </div>
                </div>
                <div class="p-10 bg-blue-600 rounded-[3rem] text-center shadow-2xl">
                    <p class="text-xs font-black uppercase tracking-[0.4em] mb-2 text-white/70">${d.d_res}</p>
                    <h3 id="d-result-val" class="text-6xl font-black text-white">0.00 €</h3>
                </div>
            </div>`;
            break;
    }
    container.innerHTML = html;
}

// Thirrja fillestare
window.addEventListener('DOMContentLoaded', () => {
    applyTheme();
    setLanguage(currentLang);
    renderView('trusti', document.querySelector('.mobile-nav-item'));
});
</script>
</body>
</html>
