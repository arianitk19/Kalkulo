    <style>
        :root { 
            --accent: #10b981; 
            --bg: #010204; 
            --glass: rgba(10, 15, 25, 0.7);
        }
        
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background: var(--bg); 
            color: #fff; 
            overflow: hidden; 
            touch-action: manipulation; 
        }

        .glass-view {
            background: var(--glass);
            backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Navigimi Mobile & Desktop */
        .mobile-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .active-nav { color: var(--accent); transform: translateY(-5px); }
        .active-nav svg { filter: drop-shadow(0 0 12px var(--accent)); }

        /* Sfondi Dinamik për Këmbimin */
        .money-bg {
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.pattern');
            background-color: rgba(16, 185, 129, 0.05);
        }

        /* Inputet Profesionale */
        input {
            background: transparent;
            border-bottom: 2px solid rgba(255,255,255,0.05);
            transition: all 0.4s ease;
        }
        input:focus {
            border-bottom-color: var(--accent);
            transform: scale(1.01);
            outline: none;
        }

        /* Scrollbar i padukshëm */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Animacionet e Sektorëve */
        .sector-animate { animation: fadeInUp 0.6s ease forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

let currentLang = 'sq';

function setLanguage(l) {
    currentLang = l;
    // Përditëso tekstet në Settings
    document.getElementById('sett-title').innerText = langData[l].title;
    document.getElementById('sett-subtitle').innerText = langData[l].sub;
    document.getElementById('label-notifications').innerText = langData[l].notif;
    document.getElementById('label-mode').innerText = langData[l].mode;
    document.getElementById('label-lang').innerText = langData[l].lang;

    // Përditëso Butonat e Gjuhës
    const isSq = l === 'sq';
    document.getElementById('lang-sq').className = isSq ? 'flex-1 py-2 rounded-lg text-xs font-bold bg-emerald-500 text-black' : 'flex-1 py-2 rounded-lg text-xs font-bold text-gray-400';
    document.getElementById('lang-en').className = !isSq ? 'flex-1 py-2 rounded-lg text-xs font-bold bg-emerald-500 text-black' : 'flex-1 py-2 rounded-lg text-xs font-bold text-gray-400';

    // Përditëso Navigimin
    const navItems = document.querySelectorAll('.mobile-nav-item span');
    const keys = ['nav_trusti', 'nav_valuta', 'nav_paga', 'nav_kesco', 'nav_dogana', 'nav_crypto'];
    navItems.forEach((span, i) => { span.innerText = langData[l][keys[i]]; });
}


let isDarkMode = localStorage.getItem('k-theme') !== 'light';

function applyTheme() {
    const root = document.documentElement;
    const circle = document.getElementById('theme-circle');
    const toggleBg = document.getElementById('theme-toggle');

    if (!isDarkMode) {
        root.classList.remove('dark');
        document.body.style.backgroundColor = "#f1f5f9"; // Slate 100 (E këndshme për sytë)
        document.body.style.color = "#1e293b";
        circle.style.transform = "translateX(-24px)";
        circle.classList.replace('bg-emerald-500', 'bg-slate-400');
        toggleBg.style.backgroundColor = "rgba(0,0,0,0.05)";
    } else {
        root.classList.add('dark');
        document.body.style.backgroundColor = "#010204";
        document.body.style.color = "#ffffff";
        circle.style.transform = "translateX(0)";
        circle.classList.replace('bg-slate-400', 'bg-emerald-500');
        toggleBg.style.backgroundColor = "rgba(16,185,129,0.2)";
    }
}

function toggleTheme() {
    isDarkMode = !isDarkMode;
    localStorage.setItem('k-theme', isDarkMode ? 'dark' : 'light');
    applyTheme();
}

// --- SISTEMI I NJOFTIMEVE (REAL API) ---
let notificationsActive = false;
function toggleNotifications() {
    const circle = document.getElementById('notif-circle');
    const toggleBg = document.getElementById('notif-toggle');

    if (!notificationsActive) {
        // Kërko leje nga sistemi operativ
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                notificationsActive = true;
                circle.classList.add('translate-x-6');
                circle.classList.replace('bg-gray-400', 'bg-emerald-500');
                toggleBg.classList.replace('bg-white/10', 'bg-emerald-500/20');
                
                // Dërgo njoftimin e parë real
                new Notification("KALKULO", {
                    body: "Njoftimet në KALKULO u aktivizuan me sukses! 🚀",
                    icon: "https://img.icons8.com/fluency/192/000000/calculator.png"
                });
            } else {
                alert("Ju lutem aktivizoni lejen për njoftime në cilësimet e browser-it.");
            }
        });
    } else {
        notificationsActive = false;
        circle.classList.remove('translate-x-6');
        circle.classList.replace('bg-emerald-500', 'bg-gray-400');
        toggleBg.classList.replace('bg-emerald-500/20', 'bg-white/10');
    }
}

        // --- 2. DYNAMIC CONTENT INJECTION (NO REDUCTION) ---
        function renderView(view, el) {
            document.querySelectorAll('.mobile-nav-item').forEach(i => i.classList.remove('active-nav'));
            if(el) el.classList.add('active-nav');

            const content = document.getElementById('content-inner');

                injectData(view, content);
                gsap.to(content, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" });
            }});
        }

        // --- 3. MATH ENGINE (PROFESSIONAL CALCULATIONS) ---
        function calcT() {
            const b = parseFloat(document.getElementById('t-bruto').value) || 0;
            const p = b * 0.05;
            document.getElementById('t-p').innerText = p.toFixed(2) + " €";
            document.getElementById('t-d').innerText = p.toFixed(2) + " €";
            document.getElementById('t-t').innerText = (p * 2).toFixed(2) + " €";
        }

        function calcV() {
            const eur = parseFloat(document.getElementById('v-in').value) || 0;
            const rates = { USD: 1.09, GBP: 0.84, CHF: 0.96, ALL: 102.5, TRY: 35.2, AUD: 1.65, CAD: 1.48, JPY: 161.4 };
            for(let k in rates) {
                const el = document.getElementById('v-'+k);
                if(el) el.innerText = (eur * rates[k]).toFixed(2);
            }
        }

        function calcP() {
            const b = parseFloat(document.getElementById('p-in').value) || 0;
            const t = b * 0.05; // Trusti
            let taxable = b - t - 250; // Pragu i ri 250
            let tax = 0;
            if(taxable > 0) {
                if(taxable <= 200) tax = taxable * 0.08;
                else tax = (200 * 0.08) + ((taxable - 200) * 0.10);
            }
            document.getElementById('p-trust').innerText = t.toFixed(2) + " €";
            document.getElementById('p-atk').innerText = tax.toFixed(2) + " €";
            document.getElementById('p-neto').innerText = (b - t - tax).toFixed(2) + " €";
        }

        function calcK() {
            const d = parseFloat(document.getElementById('k-d').value) || 0;
            const n = parseFloat(document.getElementById('k-n').value) || 0;
            let sum = (d * 0.07) + (n * 0.03) + 2.50; // Tarifa fikse
            document.getElementById('k-res').innerText = (sum * 1.08).toFixed(2) + " €"; // +8% TVSH
        }

        function calcD() {
            const kub = parseFloat(document.getElementById('d-kub').value) || 0;
            const vle = parseFloat(document.getElementById('d-vle').value) || 0;
            const res = (vle * 0.10) + (kub * 0.50) + (vle * 0.18); // Akciza + TVSH + Dogana (E thjeshtuar)
            document.getElementById('d-res').innerText = res.toFixed(2) + " €";
        }

        function calcC() {
            const inv = parseFloat(document.getElementById('c-in').value) || 0;
            document.getElementById('c-btc').innerText = (inv / 65000).toFixed(6);
            document.getElementById('c-eth').innerText = (inv / 3500).toFixed(6);
            document.getElementById('c-sol').innerText = (inv / 140).toFixed(6);
        }

        function openSettings() {
            const s = document.getElementById('settings');
            s.classList.toggle('translate-x-full');
        }
    </script>
